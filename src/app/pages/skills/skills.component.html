<section class="page-section skills-section">
  <div class="skills-background">
    <div class="floating-elements">
      <div class="floating-element element-1"></div>
      <div class="floating-element element-2"></div>
      <div class="floating-element element-3"></div>
    </div>
  </div>
  
  <div class="skills-container">
    <div class="skills-header animate-fadeInUp">
      <h2 class="section-title">My Skills & Expertise</h2>
      <p class="section-subtitle">Technologies I work with to create amazing digital experiences</p>
    </div>

    <div class="skills-grid">
      <div class="skills-carousel-wrapper">
        <div class="skills-carousel-track" [style.transform]="'translateX(' + translateValue + ')'">
          <div 
            *ngFor="let skill of skills; let i = index" 
            class="skill-card animate-fadeInUp"
            [style.animation-delay]="(i * 0.1) + 's'"
            [style.width.px]="cardWidth"
            (mouseenter)="onSkillHover(skill)"
            (mouseleave)="onSkillLeave()"
          >
            <div class="skill-card-inner">
              <div class="skill-icon-wrapper">
                <i [class]="skill.icon" [style.color]="skill.color" class="skill-icon"></i>
                <div class="skill-icon-bg" [style.background-color]="skill.color + '20'"></div>
              </div>
              <div class="skill-content">
                <h3 class="skill-name">{{ skill.name }}</h3>
                <div class="skill-level">
                  <div class="skill-progress">
                    <div class="skill-progress-bar" [style.width.%]="skill.level" [style.background-color]="skill.color"></div>
                  </div>
                  <span class="skill-percentage">{{ skill.level }}%</span>
                </div>
                <ul class="skill-points">
                  <li *ngFor="let point of skill.points">{{ point }}</li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="carousel-nav">
        <button class="nav-btn prev" (click)="prev()">
          <i class="fas fa-chevron-left"></i>
        </button>
        <button class="nav-btn next" (click)="next()">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>

    <div class="skills-categories">
      <div class="category-section animate-fadeInLeft">
        <h3>Frontend Development</h3>
        <div class="tech-tags">
          <span class="tech-tag">Angular</span>
          <span class="tech-tag">TypeScript</span>
          <span class="tech-tag">JavaScript</span>
          <span class="tech-tag">HTML5</span>
          <span class="tech-tag">CSS3</span>
        </div>
      </div>
      
      <div class="category-section animate-fadeInRight">
        <h3>Backend Development</h3>
        <div class="tech-tags">
          <span class="tech-tag">.NET Core</span>
          <span class="tech-tag">C#</span>
          <span class="tech-tag">REST APIs</span>
        </div>
      </div>
      
      <div class="category-section animate-fadeInLeft">
        <h3>Database & Tools</h3>
        <div class="tech-tags">
          <span class="tech-tag">SQL Server</span>
          <span class="tech-tag">MySQL</span>
          <span class="tech-tag">Git</span>
          <span class="tech-tag">Docker</span>
        </div>
      </div>
    </div>
  </div>
</section>
